field_expansion:
  supported: false
  note: >-
    No `expand`/`fields`/`include` parameter. Related objects are inlined as reference sub-schemas instead —
    NameReferenceSchema, EmailReferenceSchema, ExternalIdReferenceSchema, NameExternalIdReferenceSchema — each
    carrying just enough of the related entity (name / email / external_id) to code a transaction without a
    second call.
metadata:
  supported: true
  mechanism: custom fields
  note: >-
    Float exposes user-defined metadata as first-class Custom Fields (with typed options and rules), not as an
    opaque `metadata` map. Custom fields attach to card transactions, bills and reimbursements and are managed
    through /v1/custom-fields.
external_id:
  supported: true
  note: >-
    GL codes, tax codes, vendors and subsidiaries all carry an `external_id`, which is the join key against the
    customer's ERP. This is the primary correlation mechanism for accounting integrations.
