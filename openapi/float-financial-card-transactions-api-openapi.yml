    NameReferenceSchema_TeamSchema_:
      properties:
        id:
          description: Unique identifier for the referenced entity.
          format: uuid
          title: Id
          type: string
        name:
          description: Name of the referenced entity.
          title: Name
          type: string
      required:
      - id
      - name
      title: NameReferenceSchema[TeamSchema]
      type: object
    CardTransactionType:
      enum:
      - CAPTURE
      - REFUND
      title: CardTransactionType
      type: string
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
