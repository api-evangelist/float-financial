          title: Description
          type: string
        start_date:
          description: Start date of the card limit.
          format: date-time
          title: Start Date
          type: string
        end_date:
          description: End date of the card limit.  If None, the limit is ongoing.
          format: date-time
          nullable: true
          title: End Date
          type: string
        expiry_date:
          description: Expiry date of the card limit.
          format: date
          nullable: true
          title: Expiry Date
          type: string
        amount:
