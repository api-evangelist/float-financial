          description: Unique identifier for the card limit.
          format: uuid
          title: Id
          type: string
        card_id:
          description: Unique identifier for the card.
          format: uuid
          title: Card Id
          type: string
        type:
          $ref: '#/components/schemas/CardLimitType'
          description: The type of this card limit.
        description:
