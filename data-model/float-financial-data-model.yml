lifecycle_axis:
  note: >-
    Three spend objects (CardTransaction, Bill, ReimbursementReport) share an export lifecycle — each carries
    exports[] and an export/accounting stage (AccountingStageEnum / ExportStatus) plus a `sync` or accounting
    review transition. That shared lifecycle, not the object graph, is what an accounting integration is
    actually written against.
