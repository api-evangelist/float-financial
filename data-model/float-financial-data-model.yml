    `external_id` is the correlation key to the customer's accounting system and is the backbone of the whole
    integration model — the accounting guide instructs integrators to create coding objects in Float carrying
    the ERP's own identifiers.
reference_pattern:
  note: >-
    Float does not use plain foreign-key ids for related objects. Instead it embeds one of four purpose-built
    reference wrappers, each carrying the minimum a coder needs without a second call.
  wrappers:
  - name: ReferenceSchema
    carries: [id]
  - name: NameReferenceSchema
    carries: [id, name]
  - name: EmailReferenceSchema
    carries: [id, email]
  - name: ExternalIdReferenceSchema
    carries: [id, external_id]
  - name: NameExternalIdReferenceSchema
    carries: [id, name, external_id]
