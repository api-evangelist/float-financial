gap:
  declared_in_spec: false
  detail: >-
    THE ERROR ENVELOPE IS REAL BUT UNDECLARED. All 51 error responses in Float's OpenAPI carry a description
    string only — none has a `schema`, and components.schemas contains no Error/Problem/ValidationError type.
    A client generated from this spec therefore has no typed error, and an agent cannot know that `error` is the
    field to branch on. 401 is not declared on ANY of the 71 operations even though every authenticated call can
    return it; 429 and 5xx are likewise absent. This is the single highest-value fix available to Float: define
    one Error schema, reference it from every 4xx/5xx response, and add 401/429/500.
