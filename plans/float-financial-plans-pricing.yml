api_access_note: >-
  Float's pricing page does NOT list API access as a tier feature on any of the three plans, and neither the API
  documentation nor the "Get Started with Float's Public API" help article states a plan requirement. Third-party
  reviews assert the API is limited to Professional and Enterprise; that claim is NOT corroborated by any Float
  page probed here, so it is recorded as unverified rather than asserted. What IS on the pricing page is that
  API tokens are minted by an Administrator in the Float web app, and that the NetSuite integration and SAML SSO
  are Professional/Enterprise only.
