verbatim: >-
  "Can I create a Sandbox environment to test Float's API? No, Float doesn't offer a sandbox or test environment
  for API access."
note: >-
  Recorded because it is an explicit, documented NEGATIVE from Float's own FAQ, not an absence we inferred. There
  is one environment — production, https://api.floatfinancial.com — and one credential type, a live per-business
  bearer token minted by an Administrator in the Float web app. No `Sandbox` pointer is emitted in apis.yml: the
  artifact documents the absence of a sandbox and must not be scored as the presence of one.
consequences:
  - Integration development and testing happen against live business data and live cards.
  - >-
    The two BETA write operations (createCard, createCardLimit) issue real cards and real spend limits — there is
    no non-production path to exercise them.
  - >-
    Webhook consumers cannot trigger transaction.authorized / transaction.cleared events on demand; a real card
    purchase is required to produce one.
  - >-
    There is no key-prefix distinction between test and live credentials, so a leaked token cannot be triaged as
    "only test".
