apis:
- name: Float Public API
  description: >-
    REST API (OpenAPI 3.1.0, 71 operations across 47 paths) for automating accounting and reporting against
    Float. Read card transactions, account transactions, bills, bill attachments, payments, reimbursements
    and receipts; manage the coding dimensions (GL codes, tax codes, tax components, custom fields, vendors,
    subsidiaries); read cards, card limits, teams, users, approval and submission policies; create and manage
    API accounting connections and webhook subscriptions. Bearer-token auth with per-business API tokens
    issued from the Float web app. Cursor-free page/page_size pagination with created_at range filters.
  humanURL: https://docs.floatfinancial.com/
  baseURL: https://api.floatfinancial.com
