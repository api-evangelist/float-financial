x-not-emitted:
  note: >-
    Artifacts written that document an ABSENCE deliberately carry no apis.yml pointer, so a recorded negative is
    never scored as a presence. Recorded here so a later round does not "fix" them by adding one.
  pointers:
  - type: StatusPage
    reason: >-
      Float Financial publishes no status page. status.floatfinancial.com does not resolve; status.float.com
      (HTTP 200) belongs to Float the resource-management product at float.com, a different company sharing the
      brand name — its components are "Float App", "www.float.com" and "Float Payments & Subscriptions".
  - type: Deprecation
    reason: No deprecation policy and no RFC 8594 Sunset/Deprecation headers.
  - type: SDKs
    reason: >-
      No first-party client library in any registry — npm search empty, PyPI 404, and the six public repos in
      github.com/floatfinancial are forks of third-party libraries, not Float API clients.
  - type: WellKnown
    reason: >-
      All eight /.well-known/* paths 404 on floatfinancial.com, api.floatfinancial.com and
      docs.floatfinancial.com. app.floatfinancial.com answers 200 for every path with the SPA HTML shell, which
      is a miss, not a document.
  - type: SecurityTxt
    reason: No RFC 9116 security.txt served. The security contact is prose on floatfinancial.com/security.
  - type: AgentCard
    reason: >-
      No A2A agent card. /.well-known/agent-card.json and /.well-known/agent.json 404 on every real host; the
      app host's 200s are SPA shells.
  - type: MCPServer
    reason: >-
      Float ships no MCP server. mcp/float-financial-mcp.yml is a DERIVED candidate tool list with
      deployment.mode = none — pointing at it would credit an agent surface that does not exist.
  - type: Sandbox
    reason: >-
      Float's own FAQ states it offers no sandbox or test environment. sandbox/float-financial-sandbox.yml
      documents that absence.
  - type: AsyncAPI
    reason: >-
      No AsyncAPI document published and the OpenAPI webhooks object is empty. The four documented
      card-transaction events are captured as a webhook catalog under type Webhooks instead.
  - type: OAuthScopes
    reason: No OAuth or OIDC — a single unscoped http/bearer scheme. No scope surface exists to record.
  - type: DeclineCodes
    reason: Float is an issuer, not an acquirer, and publishes no decline-code reference.
  - type: Postman
    reason: Postman search for "floatfinancial" and "float financial" returned zero public workspaces.
  - type: Roadmap
    reason: floatfinancial.com/roadmap and docs.floatfinancial.com/roadmap both 404.
  - type: CLI
    reason: No first-party CLI published.
  - type: Components
    reason: No embeddable/client-side UI component library published.
