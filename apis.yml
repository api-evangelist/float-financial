aid: float-financial
name: Float Financial
description: >-
  Float Financial Solutions Inc. is a Toronto-based Canadian business finance platform combining corporate
  charge cards, high-yield business accounts, expense management, accounts payable / bill pay, employee
  reimbursements and multi-currency FX into one spend management product for Canadian companies. Founded in
  2019 and used by thousands of Canadian businesses, Float publishes a REST "Float Public API" at
  api.floatfinancial.com that exposes card and account transactions, cards and card limits, bills and bill
  attachments, payments, reimbursements, receipts, vendors, GL codes, tax codes and components, custom
  fields, subsidiaries, teams, users, approval and submission policies, accounting connections and webhook
  subscriptions — designed primarily for finance teams building custom accounting/ERP integrations where
  Float's packaged QuickBooks Online, Xero and NetSuite connectors do not fit.
